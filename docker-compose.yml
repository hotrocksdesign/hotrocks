services:
  mysql:
    image: mysql:8.0
    container_name: hotrocks-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-hotrocks}
      MYSQL_USER: ${DB_USERNAME:-hotrocks}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotrocks}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - hotrocks-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotrocks-app
    working_dir: /app
    environment:
      APP_NAME: "Hot Rocks"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hotrocks}
      DB_USERNAME: ${DB_USERNAME:-hotrocks}
      DB_PASSWORD: ${DB_PASSWORD:-hotrocks}
      SHOP_URL: ${SHOP_URL}
      INSTAGRAM_URL: ${INSTAGRAM_URL}
      INSTAGRAM_GRAPH_API_TOKEN: ${INSTAGRAM_GRAPH_API_TOKEN}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_BUSINESS_ACCOUNT_ID}
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hotrocks-network
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host 0.0.0.0 --port 8000"

volumes:
  mysql-data:

networks:
  hotrocks-network:
    driver: bridge
