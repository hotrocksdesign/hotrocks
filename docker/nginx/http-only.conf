# Fase 1: usar este archivo ANTES de tener certificado SSL.
# Sirve el sitio por HTTP y expone /.well-known/acme-challenge/ para que
# Certbot pueda validar el dominio y emitir el certificado.
#
# Reemplazá "tudominio.com" por tu dominio real antes de usarlo.

server {
    listen 80;
    server_name tudominio.com;

    client_max_body_size 60M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
