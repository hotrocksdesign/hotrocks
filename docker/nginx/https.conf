# Fase 2: usar este archivo DESPUÉS de obtener el certificado con Certbot.
# Redirige HTTP -> HTTPS y sirve el sitio con SSL.

server {
    listen 80;
    server_name hotrocks.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hotrocks.com.ar;

    ssl_certificate     /etc/letsencrypt/live/hotrocks.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotrocks.com.ar/privkey.pem;

    client_max_body_size 60M;

    location / {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
